name: NetBoost CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (macOS ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Build NetBoost
        run: ./Scripts/build.sh

      - name: Run Test Suite
        run: ./Scripts/run_tests.sh

name: NetBoost CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP/Contents/Developer" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "Using default developer directory: $(xcode-select -p)"
          fi

      - name: Verify Swift Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build NetBoost
        run: ./Scripts/build.sh

      - name: Run Test Suite
        run: ./Scripts/run_tests.sh --no-parallel
